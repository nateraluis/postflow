name: Deploy to products server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env file from GitHub secrets
        run: |
          cat > .env <<EOF
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          S3_AWS_STORAGE_BUCKET_NAME=${{ secrets.S3_AWS_STORAGE_BUCKET_NAME }}
          AWS_STORAGE_MEDIA_BUCKET_NAME=${{ secrets.AWS_STORAGE_MEDIA_BUCKET_NAME }}
          MEDIA_ACCESS_KEY=${{ secrets.MEDIA_ACCESS_KEY }}
          MEDIA_SECRET_ACCESS_KEY=${{ secrets.MEDIA_SECRET_ACCESS_KEY }}
          REDIRECT_URI=${{ secrets.REDIRECT_URI }}
          PIXELFED_REDIRECT_URI=${{ secrets.PIXELFED_REDIRECT_URI }}
          AWS_S3_REGION_NAME=${{ secrets.AWS_S3_REGION_NAME }}
          FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_VERIFY_TOKEN=${{ secrets.FACEBOOK_VERIFY_TOKEN }}
          INSTAGRAM_BUSINESS_REDIRECT_URI=${{ secrets.INSTAGRAM_BUSINESS_REDIRECT_URI }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          FIELD_ENCRYPTION_KEY=${{ secrets.FIELD_ENCRYPTION_KEY }}
          SUBSCRIPTION_EXEMPT_EMAILS=${{ secrets.SUBSCRIPTION_EXEMPT_EMAILS }}
          LINKEDIN_CLIENT_ID=${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET=${{ secrets.LINKEDIN_CLIENT_SECRET }}
          THREADS_APP_ID=${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET=${{ secrets.THREADS_APP_SECRET }}
          GITHUB_ANALYTICS_TOKEN=${{ secrets.GH_ANALYTICS_TOKEN }}
          DEBUG=False
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Upload .env
        run: |
          scp -i ~/.ssh/id_rsa .env root@${{ secrets.EC2_HOST }}:/home/postflow/app/core/.env.staged

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_rsa root@${{ secrets.EC2_HOST }} << 'DEPLOY'
          set -e
          mv /home/postflow/app/core/.env.staged /home/postflow/app/core/.env
          chown postflow:postflow /home/postflow/app/core/.env
          chmod 600 /home/postflow/app/core/.env

          sudo -u postflow bash <<'APP'
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          cd /home/postflow/app

          echo "--- Pulling latest changes ---"
          git fetch origin main
          git reset --hard origin/main

          echo "--- Syncing Python dependencies ---"
          uv sync --frozen --no-dev

          echo "--- Building Tailwind CSS ---"
          cd theme/static_src && npm ci --silent && cd ../..
          .venv/bin/python manage.py tailwind build 2>&1 | tail -3

          echo "--- Running migrations ---"
          .venv/bin/python manage.py migrate --noinput

          echo "--- Collecting static files ---"
          .venv/bin/python manage.py collectstatic --noinput 2>&1 | tail -3
          APP

          echo "--- Installing systemd services ---"
          cp /home/postflow/app/systemd/postflow.target /etc/systemd/system/
          cp /home/postflow/app/systemd/postflow-web.service /etc/systemd/system/
          cp /home/postflow/app/systemd/postflow-scheduler.service /etc/systemd/system/
          systemctl daemon-reload
          systemctl enable postflow.target
          systemctl restart postflow.target

          echo "--- Verifying services ---"
          sleep 3
          systemctl is-active postflow-web.service
          systemctl is-active postflow-scheduler.service
          DEPLOY

      - name: Health check
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" https://postflow.photo/)
          echo "site → $code"
          test "$code" = "200"
