name: Deploy to products server

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Join tailnet (SSH is only reachable over Tailscale)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env file from GitHub secrets
        run: |
          cat > .env <<EOF
          DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          S3_AWS_STORAGE_BUCKET_NAME=${{ secrets.S3_AWS_STORAGE_BUCKET_NAME }}
          AWS_STORAGE_MEDIA_BUCKET_NAME=${{ secrets.AWS_STORAGE_MEDIA_BUCKET_NAME }}
          MEDIA_ACCESS_KEY=${{ secrets.MEDIA_ACCESS_KEY }}
          MEDIA_SECRET_ACCESS_KEY=${{ secrets.MEDIA_SECRET_ACCESS_KEY }}
          REDIRECT_URI=${{ secrets.REDIRECT_URI }}
          PIXELFED_REDIRECT_URI=${{ secrets.PIXELFED_REDIRECT_URI }}
          AWS_S3_REGION_NAME=${{ secrets.AWS_S3_REGION_NAME }}
          FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_VERIFY_TOKEN=${{ secrets.FACEBOOK_VERIFY_TOKEN }}
          INSTAGRAM_BUSINESS_REDIRECT_URI=${{ secrets.INSTAGRAM_BUSINESS_REDIRECT_URI }}
          STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          FIELD_ENCRYPTION_KEY=${{ secrets.FIELD_ENCRYPTION_KEY }}
          SUBSCRIPTION_EXEMPT_EMAILS=${{ secrets.SUBSCRIPTION_EXEMPT_EMAILS }}
          LINKEDIN_CLIENT_ID=${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET=${{ secrets.LINKEDIN_CLIENT_SECRET }}
          THREADS_APP_ID=${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET=${{ secrets.THREADS_APP_SECRET }}
          GITHUB_ANALYTICS_TOKEN=${{ secrets.GH_ANALYTICS_TOKEN }}
          DEBUG=False
          EOF
          sed -i 's/^[[:space:]]*//' .env

      # CI logs in as the app user, never root. The only root right it has is
      # /etc/sudoers.d/postflow-deploy: "systemctl restart postflow.target".
      - name: Upload .env
        run: |
          scp -i ~/.ssh/id_rsa .env postflow@${{ secrets.EC2_HOST }}:/home/postflow/app/core/.env.staged

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_rsa postflow@${{ secrets.EC2_HOST }} << 'DEPLOY'
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          chmod 600 /home/postflow/app/core/.env.staged
          mv /home/postflow/app/core/.env.staged /home/postflow/app/core/.env
          cd /home/postflow/app

          echo "--- Pulling latest changes ---"
          git fetch origin main
          git reset --hard origin/main

          echo "--- Syncing Python dependencies ---"
          uv sync --frozen --no-dev

          echo "--- Building Tailwind CSS ---"
          cd theme/static_src && npm ci --silent && cd ../..
          .venv/bin/python manage.py tailwind build 2>&1 | tail -3

          echo "--- Running migrations ---"
          .venv/bin/python manage.py migrate --noinput

          echo "--- Collecting static files ---"
          .venv/bin/python manage.py collectstatic --noinput 2>&1 | tail -3

          git rev-parse HEAD > DEPLOYED_SHA

          # Unit files in systemd/ are installed on the box by hand (needs root).
          # Flag drift instead of silently running stale units.
          for u in postflow.target postflow-web.service postflow-scheduler.service; do
            cmp -s "systemd/$u" "/etc/systemd/system/$u" || \
              echo "::warning::systemd/$u differs from the installed unit; install it on the box as root"
          done

          echo "--- Restarting ---"
          sudo -n /usr/bin/systemctl restart postflow.target
          sleep 3
          systemctl is-active postflow-web.service
          systemctl is-active postflow-scheduler.service
          DEPLOY

      - name: Health check
        run: |
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" https://postflow.photo/)
          echo "site → $code"
          test "$code" = "200"
