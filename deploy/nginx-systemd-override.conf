# Installed to /etc/systemd/system/nginx.service.d/override.conf by deploy.
# The stock nginx unit has Restart=no: one failed start (e.g. a transient DNS
# failure while validating the config) leaves the site down until someone
# intervenes. Retry forever instead, and wait for the network at boot.

[Unit]
After=network-online.target
Wants=network-online.target
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5s
