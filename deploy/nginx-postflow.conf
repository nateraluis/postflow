proxy_cache_path /tmp/nginx keys_zone=mycache:1m;

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name postflow.photo www.postflow.photo;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name postflow.photo www.postflow.photo;

    ssl_certificate /etc/letsencrypt/live/postflow.photo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postflow.photo/privkey.pem;

    # SSL/TLS Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;

    # uwsgi_pass to local uwsgi socket (faster than HTTP proxy)
    location / {
        uwsgi_pass 127.0.0.1:8000;
        include uwsgi_params;
        uwsgi_param Host $host;
        uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
        uwsgi_param X-Forwarded-Proto $scheme;
    }

    location /healthcheck {
        add_header Content-Type text/plain;
        return 200 'Up and running!';
    }

    location /cert-status {
        add_header Content-Type text/plain;
        return 200 'Certificate OK';
    }

    # Static files proxied to S3.
    # The upstream host is held in a variable so nginx resolves it at request
    # time via the resolver below, not at config load — a DNS blip during
    # startup/deploy must never prevent nginx from starting.
    location /static/ {
        resolver 127.0.0.53 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $s3_static postflow-static.s3.eu-central-1.amazonaws.com;
        rewrite ^/static/(.*)$ /$1 break;
        proxy_pass https://$s3_static;
        proxy_set_header Host $s3_static;
        proxy_ssl_server_name on;
        proxy_cache mycache;
        proxy_cache_background_update on;
        proxy_cache_use_stale updating;
        proxy_cache_valid 60s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
